<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>計分控制台</title>
<style>
  :root{--bg:#0b1220;--panel:#151f2e;--panel2:#1c2938;--ink:#eef4fb;--muted:#8fa3b8;
        --line:#26374a;--ok:#22c55e;--bad:#ef4444;--a:#3B82F6;--b:#EF4444;--c:#F59E0B;--d:#10B981}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","Noto Sans CJK TC",-apple-system,sans-serif;font-size:16px}
  body{padding:8px 10px 140px; padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  .bar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),rgba(11,18,32,.92));
    padding:6px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .st{font-size:13px;color:var(--muted)}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;
    padding:10px 12px;font-size:15px;font-weight:700;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.warn{background:#3a1d1d;border-color:#5c2a2a;color:#ffb4b4}
  .btn.lock{background:#1f3a2a;border-color:#2f6b45;color:#b9f6ce}
  .btn.lock.on{background:#4a1d1d;border-color:#7a2a2a;color:#ffc9c9}
  .team{border:2px solid var(--line);border-left:8px solid var(--tc);border-radius:14px;
    background:var(--panel);padding:10px;margin:10px 0}
  .trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tname{font-size:20px;font-weight:800}
  .tscore{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .row.two{grid-template-columns:repeat(2,1fr)}
  .big{padding:16px 8px;font-size:19px;font-weight:900;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink)}
  .primary{background:#1a4d33;border-color:#2f7a52;color:#d6ffe6;font-size:17px}
  .plus{background:#12331f;border-color:#20563a;color:#b9f6ce}
  .minus{background:#331414;border-color:#5b2323;color:#ffc0c0}
  h3{font-size:14px;color:var(--muted);margin:22px 0 8px;letter-spacing:.08em;font-weight:800}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  label{font-size:14px;color:var(--muted);display:block;margin:8px 0 4px}
  select,input[type=number],input[type=text]{width:100%;padding:12px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px}
  .chk{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chk label{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
    padding:10px 12px;border-radius:10px;font-size:15px;color:var(--ink);margin:0}
  .log{font-size:13px;color:var(--muted);line-height:1.6;max-height:150px;overflow:auto}
  .log b{color:#cfe0f2}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(11,18,32,.96);
    border-top:1px solid var(--line);display:flex;gap:8px}
  .foot .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:92vw;text-align:center;
    background:#0f2b1c;color:#b9f6ce;
    border:1px solid #20563a;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}

  .team{padding:8px 10px;margin:8px 0;border-radius:12px}
  .tname{font-size:17px}
  .edit{background:#22384f;border:1px solid #33506e;color:#dceaf8;border-radius:9px;
    min-width:42px;min-height:38px;padding:6px 10px;font-size:16px;line-height:1;cursor:pointer}
  .edit:active{transform:scale(.94)}
  .tscore{font-size:27px}
  .row{gap:6px;margin-top:6px}
  .big{padding:12px 6px;font-size:16px;border-radius:10px}
  h3{font-size:13px;margin:14px 0 6px}
  details.ops>.opsbody{padding-top:12px;display:flex;flex-direction:column;gap:14px}
  summary{cursor:pointer;font-weight:900;font-size:16px;color:#eaf3ff;list-style:none;padding:4px 0}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:#8fa3b8}
  details[open] summary::before{content:"▾ "}

  /* ===== 卡牌算式：一個算式一個獨立區塊 ===== */
  .op{background:#121d2b;border:1px solid #2b3f57;border-left:5px solid #3B82F6;
      border-radius:14px;padding:14px 12px 12px}
  .op.warn{border-left-color:#F59E0B}
  .op h4{margin:0;font-size:18px;font-weight:900;color:#eaf3ff;
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
  .op h4 .num{display:inline-flex;align-items:center;justify-content:center;flex:none;
      width:27px;height:27px;border-radius:999px;background:#1e3a5f;color:#d6e8ff;font-size:15px;font-weight:900}
  .op.warn h4 .num{background:#4a3312;color:#ffd89a}
  .op h4 .tag{font-size:13px;font-weight:700;color:#a8bccf;background:#0d1725;
      border:1px solid #2b3f57;border-radius:999px;padding:3px 10px}
  .op .oprow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:11px}
  .op .oprow.two{grid-template-columns:repeat(2,1fr)}
  .op .oprow.one{grid-template-columns:1fr}
  .op select,.op input[type=number]{padding:14px 10px;font-size:18px;font-weight:800;
      min-height:54px;border-radius:12px;border-color:#2b3f57;background:#182635}
  .op .big{min-height:54px;font-size:19px;padding:14px 8px}
  .op .hint{margin:10px 0 0;font-size:14.5px;line-height:1.55;color:#a8bccf}
  .op label.inline{display:flex;align-items:center;gap:8px;margin:0;min-height:54px;
      background:#182635;border:1px solid #2b3f57;border-radius:12px;padding:0 12px;
      font-size:16px;font-weight:800;color:#dbe9f7}
  .op label.inline input{flex:1;min-height:auto;border:none;background:transparent;
      padding:6px 0;text-align:right;font-size:19px;font-weight:900;color:#fff}
  .op .chk{margin-top:11px}
  .op .chk label{font-size:17px;font-weight:800;min-height:50px;padding:12px 14px;border-color:#2b3f57;background:#182635}
  .op label.inline input::-webkit-outer-spin-button,
  .op label.inline input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* 操作紀錄字大一點 */
  .log{font-size:14.5px;line-height:1.7}
  .toast.show{opacity:1}
  .toast.err{background:#331414;border-color:#5b2323;color:#ffc0c0}
</style>
</head>
<body>

<div class="bar">
  <span class="dot" id="dot"></span>
  <span class="st" id="st">連線中…</span>
  <span style="flex:1"></span>
  <button class="btn lock" id="lockBtn">可操作（點此鎖定）</button>
</div>

<div id="teams"></div>



<h3>操作紀錄</h3>
<div class="card log" id="log"></div>

<details class="card ops" id="nameBox"><summary>隊伍名稱／活動名稱（點開改）</summary>
<div class="opsbody">
  <label>活動名稱（大螢幕左上角）</label>
  <input type="text" id="eventIn" placeholder="例：2026 秋季團隊競賽">
  <label>A 隊</label><input type="text" id="nmInA" maxlength="12" placeholder="A 隊">
  <label>B 隊</label><input type="text" id="nmInB" maxlength="12" placeholder="B 隊">
  <label>C 隊</label><input type="text" id="nmInC" maxlength="12" placeholder="C 隊">
  <label>D 隊</label><input type="text" id="nmInD" maxlength="12" placeholder="D 隊">
  <div class="row two" style="margin-top:10px">
    <button class="btn big primary" onclick="applyNames()">全部套用</button>
    <button class="btn big" onclick="fillNameInputs()">重新載入</button>
  </div>
  <div class="st" style="margin-top:6px">隊名最多 12 字；留空＝不改。改完大螢幕立刻更新</div>
</div>
</details>

<details class="card ops"><summary>卡牌名稱（選填，套用時顯示在大螢幕）</summary>
<div class="opsbody">
  <input type="text" id="cardName" placeholder="例：黑洞引力晶片" list="cardList">
  <datalist id="cardList">
    <option>量子糾纏複製器</option><option>黑洞引力晶片</option><option>時空倒轉沙漏</option>
    <option>記憶洗腦射線</option><option>賽博寄生蟲</option><option>平行宇宙置換艙</option>
    <option>重力反轉矩陣</option><option>虛擬實境禁錮</option><option>元宇宙金融海嘯</option>
    <option>超新星脈衝炸彈</option><option>奈米病毒擴散</option><option>極光能源抽取器</option>
    <option>時間暫停力場</option><option>生化毒霧迷音</option><option>反烏托邦集火令</option>
    <option>天網共享竊聽器</option><option>正義聯盟重力壓制</option><option>星際海盜分贓令</option>
    <option>量子共振詛咒</option><option>高維度審判法槌</option>
  </datalist>
  <div class="st" style="margin-top:6px">留空＝不顯示卡牌橫幅</div>
</div>
</details>

<details class="card ops" id="opsBox"><summary>卡牌算式（點開）</summary>
<div class="opsbody">

  <section class="op">
    <h4><span class="num">1</span>同步為目前最高分<span class="tag">量子糾纏複製器</span></h4>
    <div class="oprow two">
      <select id="syncTeam"></select>
      <button class="big" onclick="op('syncmax',{team:v('syncTeam')})">套用</button>
    </div>
  </section>

  <section class="op">
    <h4><span class="num">2</span>吸取分數<span class="tag">黑洞引力晶片</span></h4>
    <div class="oprow two">
      <select id="fromTeam"></select>
      <select id="toTeam"></select>
    </div>
    <div class="oprow two">
      <label class="inline">百分比<input type="number" id="pctIn" value="30" inputmode="numeric"></label>
      <button class="big" onclick="op('transfer',{from:v('fromTeam'),to:v('toTeam'),pct:num('pctIn',30)})">吸取</button>
    </div>
    <p class="hint">左邊＝被吸的隊、右邊＝得分的隊（預設 30%）</p>
  </section>

  <section class="op warn">
    <h4><span class="num">3</span>減半<span class="tag">重力反轉矩陣</span></h4>
    <div class="oprow two">
      <select id="halfTeam"></select>
      <button class="big warn" onclick="confirmOp('減半','halve',{team:v('halfTeam')})">套用</button>
    </div>
  </section>

  <section class="op">
    <h4><span class="num">4</span>多隊平均<span class="tag">正義聯盟重力壓制</span></h4>
    <div class="chk" id="avgChk"></div>
    <div class="oprow two">
      <button class="big" onclick="op('average',{teams:checked('avg')})">平均</button>
      <button class="big" onclick="checked('avg',false)">清除勾選</button>
    </div>
  </section>

  <section class="op warn">
    <h4><span class="num">5</span>首尾對調<span class="tag">高維度審判法槌</span></h4>
    <div class="oprow one">
      <button class="big warn" onclick="confirmOp('首尾對調','swap_extremes',{})">第一名 ↔ 最後一名 交換分數</button>
    </div>
  </section>

  <section class="op warn">
    <h4><span class="num">6</span>全場吸取<span class="tag">元宇宙金融海嘯</span></h4>
    <div class="oprow two">
      <select id="drainTeam"></select>
      <label class="inline">每隊扣<input type="number" id="drainVal" value="1000" inputmode="numeric"></label>
    </div>
    <div class="oprow one">
      <button class="big warn" onclick="confirmOp('全場吸取','drain_all',{team:v('drainTeam'),value:num('drainVal',1000)})">套用</button>
    </div>
    <p class="hint">他隊各扣 N、本隊加 N × 3</p>
  </section>

  <section class="op">
    <h4><span class="num">7</span>平分目標隊分數<span class="tag">天網共享竊聽器</span></h4>
    <div class="oprow">
      <select id="splitTarget"></select>
      <select id="ally1"></select>
      <select id="ally2"></select>
    </div>
    <div class="oprow two">
      <label class="inline">百分比<input type="number" id="splitPct" value="50" inputmode="numeric"></label>
      <button class="big" onclick="op('split',{target:v('splitTarget'),allies:[v('ally1'),v('ally2')].filter(Boolean),pct:num('splitPct',50)})">平分給盟友</button>
    </div>
    <p class="hint">第一個＝被平分的隊，後兩個＝收分的盟友</p>
  </section>

  <section class="op warn">
    <h4><span class="num">8</span>兩隊分數互換<span class="tag">平行宇宙置換艙</span></h4>
    <div class="oprow">
      <select id="swapA"></select>
      <select id="swapB"></select>
      <button class="big warn" onclick="confirmOp('分數互換','swap_team_scores',{team_a:v('swapA'),team_b:v('swapB')})">互換</button>
    </div>
  </section>

</div>
</details>

<div class="foot">
  <button class="btn" onclick="undo()">↩︎ 復原</button>
  <button class="btn warn" onclick="resetAll()">全部歸零</button>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/supabase.js"></script>
<script>
// ====================================================================
// 線上版：狀態由控制台（這支手機）自己保管，每次變更立刻廣播給大螢幕
// ====================================================================
const SB_URL = 'https://xhbbgnsnniphsephwsrq.supabase.co';
const SB_KEY = 'sb_publishable_nrWaOOLOr9RJVvkPqh0hoQ_cEGpKPcF';
const DEFAULT_ROOM = 'tsust-mach-20261128-x7k3';
const ROOM = (new URLSearchParams(location.hash.slice(1)).get('r')) || DEFAULT_ROOM;
const LS_KEY = 'scoreboard_state_' + ROOM;

function defaultState(){
  const ids=['A','B','C','D'], cols=['#3B82F6','#EF4444','#F59E0B','#10B981'];
  return {event:'未來式團隊競賽', updated:Date.now()/1000, locked:false,
    teams:ids.map((id,i)=>({id, name:id+' 隊', color:cols[i], score:0})),
    banner:null, log:[]};
}
function loadLS(){
  try{ const raw = localStorage.getItem(LS_KEY); if(!raw) return null;
       const s = JSON.parse(raw);
       if(!s || !Array.isArray(s.teams) || s.teams.length !== 4) return null;
       return s; }catch(e){ return null; }
}
function saveLS(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

let state = null;   // 真正初始化在 COLORS/IDS 之後（避免 TDZ）
let undoStack = [];
let rtChannel = null;

// 同一個房間只能有一個控制台在寫分數；多開的分頁自動轉唯讀
const MY_ID = 'pad-' + Math.random().toString(36).slice(2, 10);
const MY_AT = Date.now();
let isWriter = true;

function teamOf(id){ return state.teams.find(t=>t.id===id); }
function addLog(desc,card){
  state.log = state.log || [];
  state.log.unshift({ts: Date.now()/1000, desc, card: card || null});
  if (state.log.length > 40) state.log.length = 40;
}
function pushUndo(){
  undoStack.push({teams: state.teams.map(t=>({id:t.id, score:t.score})),
                  banner: state.banner, logLen: (state.log||[]).length});
  if (undoStack.length > 60) undoStack.shift();
}
function publish(){
  if (!rtChannel || !isWriter) return;   // 唯讀的分頁不廣播，避免互相覆蓋
  rtChannel.send({type:'broadcast', event:'state', payload:{state, writer: MY_ID}});
}

// 最早開啟、且還活著的那一個控制台是唯一寫入者（其他的轉唯讀）
function electWriter(){
  if (!rtChannel) return;
  const st = rtChannel.presenceState() || {};
  const live = [];
  Object.keys(st).forEach(k => (st[k] || []).forEach(p => { if (p && p.at) live.push({id: k, at: p.at}); }));
  live.sort((a, b) => (a.at - b.at) || (a.id < b.id ? -1 : 1));
  const winner = live.length ? live[0].id : MY_ID;
  const nowWriter = (winner === MY_ID);
  if (nowWriter !== isWriter){ isWriter = nowWriter; }
  updateWriterBadge(live.length);
}

function updateWriterBadge(count){
  let el = document.getElementById('writerBadge');
  if (!el){
    el = document.createElement('div');
    el.id = 'writerBadge';
    el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));'
      + 'z-index:60;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.45;display:none;'
      + 'background:#3a1116;border:1px solid #7a2230;color:#ffc9d1;text-align:center';
    document.body.appendChild(el);
  }
  if (!isWriter){
    el.style.display = 'block';
    el.textContent = '唯讀模式：另一個控制台正在操作（同時開 ' + count + ' 個）。'
      + '請只留一個控制台分頁，關掉其他的就會恢復。';
    document.body.style.filter = 'saturate(.55)';
  } else {
    el.style.display = 'none';
    document.body.style.filter = '';
  }
}
function commit(){
  state.updated = Date.now()/1000;
  saveLS();
  render(state);
  publish();
}

// 與本機版 server.py 的 apply_action 完全同一套算式
function applyAction(a){
  const kind = a.type;
  const card = (a.card || '').trim() || null;
  const scores = state.teams.map(t=>t.score);
  pushUndo();

  if (kind === 'add'){
    const t = teamOf(a.team); const v = parseInt(a.value || 0);
    t.score += v; addLog(`${t.name} ${v>=0?'+':''}${v}　→ ${t.score}`, card);
  } else if (kind === 'set'){
    const t = teamOf(a.team); const v = parseInt(a.value || 0); const old = t.score;
    t.score = v; addLog(`${t.name} 設為 ${v}（原 ${old}）`, card);
  } else if (kind === 'halve'){
    const t = teamOf(a.team); const old = t.score;
    t.score = Math.floor(old / 2); addLog(`${t.name} 減半：${old} → ${t.score}`, card);
  } else if (kind === 'syncmax'){
    const t = teamOf(a.team); const top = Math.max(...scores); const old = t.score;
    t.score = top; addLog(`${t.name} 同步為目前最高分：${old} → ${top}`, card);
  } else if (kind === 'transfer'){
    const src = teamOf(a.from), dst = teamOf(a.to);
    const pct = parseFloat(a.pct === undefined ? 30 : a.pct);
    const amount = Math.round(src.score * pct / 100);
    src.score -= amount; dst.score += amount;
    addLog(`${dst.name} 吸取 ${src.name} ${pct}%（${amount}）`, card);
  } else if (kind === 'average'){
    const ids = a.teams || [];
    if (ids.length < 2){ undoStack.pop(); return {ok:false, error:'平均至少要有兩隊'}; }
    const members = ids.map(teamOf);
    const avg = Math.round(members.reduce((s,m)=>s+m.score,0) / members.length);
    const old = {}; members.forEach(m=>old[m.id]=m.score);
    members.forEach(m=>m.score = avg);
    addLog('平均 ' + members.map(m=>`${m.name} ${old[m.id]}→${avg}`).join('／'), card);
  } else if (kind === 'swap_extremes'){
    const order = state.teams.slice().sort((x,y)=>x.score-y.score);
    const lo = order[0], hi = order[order.length-1];
    const tmp = lo.score; lo.score = hi.score; hi.score = tmp;
    addLog(`首尾對調：${hi.name} ↔ ${lo.name}`, card);
  } else if (kind === 'drain_all'){
    const t = teamOf(a.team); const v = Math.abs(parseInt(a.value || 1000));
    const others = state.teams.filter(o=>o.id !== t.id);
    others.forEach(o=>o.score -= v);
    t.score += v * others.length;
    addLog(`${t.name} 全場吸取：他隊各 −${v}，本隊 +${v*others.length}`, card);
  } else if (kind === 'split'){
    const target = teamOf(a.target);
    const allies = (a.allies || []).map(teamOf).filter(Boolean);
    const pct = parseFloat(a.pct === undefined ? 50 : a.pct);
    const amount = Math.round(target.score * pct / 100);
    target.score -= amount;
    const share = Math.floor(amount / Math.max(allies.length, 1));
    allies.forEach(al=>al.score += share);
    addLog(`${allies.map(x=>x.name).join('／')} 平分 ${target.name} 的 ${pct}%（各 ${share}）`, card);
  } else if (kind === 'swap_team_scores'){
    const a1 = teamOf(a.team_a), a2 = teamOf(a.team_b);
    const tmp = a1.score; a1.score = a2.score; a2.score = tmp;
    addLog(`分數互換：${a1.name} ↔ ${a2.name}`, card);
  } else {
    undoStack.pop();
    return {ok:false, error:'未知動作：' + kind};
  }
  return {ok:true};
}

function connect(){
  if (typeof supabase === 'undefined'){
    setConn(false); toast('無法載入連線模組', true); return;
  }
  const sb = supabase.createClient(SB_URL, SB_KEY);
  rtChannel = sb.channel('room:' + ROOM, {
    config: { broadcast: {self:false}, presence: {key: MY_ID} }
  });
  rtChannel.on('broadcast', {event:'hello'}, () => { publish(); });   // 大螢幕剛開，立刻重播
  rtChannel.on('presence', {event:'sync'}, () => { electWriter(); });
  rtChannel.on('presence', {event:'join'}, () => { electWriter(); });
  rtChannel.on('presence', {event:'leave'}, () => { electWriter(); });
  rtChannel.subscribe(status => {
    const ok = status === 'SUBSCRIBED';
    setConn(ok);
    if (ok){
      rtChannel.track({at: MY_AT});
      electWriter();
      publish();
    }
  });
  // 心跳：每 2 秒重新宣告存在＋重播狀態（避免大螢幕重開或訊息遺失）
  setInterval(() => {
    if (!rtChannel) return;
    rtChannel.track({at: MY_AT});
    publish();
  }, 2000);
}

const COLORS=['#3B82F6','#EF4444','#F59E0B','#10B981'];
const IDS=['A','B','C','D'];
let locked=false, first=true;
state = loadLS() || defaultState();

const v=id=>document.getElementById(id).value;
const num=(id,def)=>{const x=parseFloat(document.getElementById(id).value); return isNaN(x)?def:x;};
function checked(prefix,clear){
  const els=[...document.querySelectorAll(`input[data-grp="${prefix}"]`)];
  if(clear===false){els.forEach(e=>e.checked=false);return [];}
  return els.filter(e=>e.checked).map(e=>e.value);
}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',1600);}

function buildTeams(){
  const box=document.getElementById('teams'); box.innerHTML='';
  IDS.forEach((id,i)=>{
    const el=document.createElement('div');
    el.className='team'; el.style.setProperty('--tc',COLORS[i]);
    el.innerHTML=`<div class="trow"><div class="tname" id="nm${id}">${id} 隊</div>
        <button class="edit" data-rename="${id}" title="改名">✎</button>
        <span style="flex:1"></span>
        <div class="tscore" id="sc${id}">0</div></div>
      <div class="row">
        <button class="big plus" data-add="100" data-t="${id}">+100</button>
        <button class="big plus" data-add="500" data-t="${id}">+500</button>
        <button class="big plus" data-add="1000" data-t="${id}">+1000</button>
      </div>
      <div class="row">
        <button class="big minus" data-add="-100" data-t="${id}">−100</button>
        <button class="big minus" data-add="-500" data-t="${id}">−500</button>
        <button class="big" data-set="1" data-t="${id}">直接設定</button>
      </div>`;
    box.appendChild(el);
  });
  box.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    const t=b.dataset.t;
    if(b.dataset.add) send({type:'add',team:t,value:parseInt(b.dataset.add)});
    if(b.dataset.rename){
      const cur=document.getElementById('nm'+t).textContent.replace(/^[A-D]\s*/,'').trim();
      const val=prompt(`把 ${t} 隊的名字改成？`,cur);
      if(val!==null&&val.trim()!=='') sendRename(t,val.trim());
      return;
    }
    if(b.dataset.set){
      const cur=document.getElementById('sc'+t).textContent.replace(/[^0-9-]/g,'');
      const val=prompt(`${t} 隊目前 ${cur}，要設成多少？`,cur);
      if(val!==null&&val.trim()!=='') send({type:'set',team:t,value:parseInt(val.replace(/[^0-9-]/g,''))||0});
    }
  });
  IDS.forEach(id=>{
    ['syncTeam','fromTeam','toTeam','halfTeam','drainTeam','splitTarget','ally1','ally2','swapA','swapB'].forEach(sel=>{
      const s=document.getElementById(sel);
      const o=document.createElement('option'); o.value=id; o.textContent=id+' 隊'; s.appendChild(o);
    });
  });
  document.getElementById('toTeam').value='A';
  document.getElementById('fromTeam').value='B';
  document.getElementById('ally2').value='';
  // 平均勾選
  const chk=document.getElementById('avgChk');
  IDS.forEach(id=>{
    const l=document.createElement('label');
    l.innerHTML=`<input type="checkbox" data-grp="avg" value="${id}"> ${id} 隊`;
    chk.appendChild(l);
  });
}

function render(s){
  const prev=state; state=s;
  document.getElementById('nmA');
  IDS.forEach(id=>{
    const t=s.teams.find(x=>x.id===id); if(!t)return;
    document.getElementById('nm'+id).textContent=t.name;
    document.getElementById('sc'+id).textContent=(t.score<0?'−':'')+Math.abs(t.score).toLocaleString('en-US');
  });
  locked=!!s.locked;
  const lb=document.getElementById('lockBtn');
  lb.textContent=locked?'已鎖定（點此解鎖）':'可操作（點此鎖定）'; lb.classList.toggle('on',locked);
  document.getElementById('log').innerHTML=(s.log||[]).slice(0,12).map(e=>{
    const t=new Date(e.ts*1000).toLocaleTimeString('zh-TW',{hour12:false});
    return `<div>${t}　${e.desc}${e.card?`　<b>[${e.card}]</b>`:''}</div>`;
  }).join('')||'<div>尚無紀錄</div>';
  fillNameInputs(true);
  first=false;
}

function sendRename(team,name){
  if(locked){ toast('已鎖定，先解鎖',true); return; }
  const t=teamOf(team); if(!t){ toast('找不到隊伍',true); return; }
  const clean=(name||'').slice(0,12);
  t.name=clean;
  addLog(`${team} 隊改名為「${clean}」`,null);
  toast(`${team} 隊 → ${clean}`);
  commit();
}

function sendEvent(ev){
  state.event=(ev||'').slice(0,40)||state.event;
  addLog('活動名稱改為「'+state.event+'」',null);
  toast('活動名稱已更新');
  commit();
}

function send(action){
  if(!isWriter){ toast('這頁是唯讀（另一個控制台在操作）',true); return; }
  if(locked){ toast('已鎖定，先解鎖',true); return; }
  const card=document.getElementById('cardName').value.trim();
  if(!action.noCard&&card) action.card=card;
  let r;
  try{ r=applyAction(action); }catch(e){ r={ok:false,error:String(e)}; }
  if(r.ok){
    // 卡牌橫幅（大螢幕會顯示 9 秒）
    if(action.card) state.banner={text:action.card, ts:Date.now()/1000};
    toast('已套用');
    commit();
  } else {
    toast(r.error||'失敗',true);
    render(state);
  }
}
function op(type,extra={}){ send(Object.assign({type},extra)); }
function confirmOp(label,type,extra){
  if(confirm(`確定要「${label}」嗎？`)) op(type,extra);
}
function undo(){
  if(!undoStack.length){ toast('沒有可復原的動作',true); return; }
  const prev=undoStack.pop();
  state.teams.forEach(t=>{
    const p=prev.teams.find(x=>x.id===t.id);
    if(p) t.score=p.score;
  });
  state.banner=prev.banner;
  if(state.log && state.log.length>prev.logLen) state.log.length=Math.max(prev.logLen,1);
  addLog('復原上一步',null);
  toast('已復原');
  commit();
}
function resetAll(){
  if(!confirm('全部歸零？可用「復原」救回。')) return;
  pushUndo();
  state.teams.forEach(t=>t.score=0);
  state.banner=null;
  addLog('全部歸零',null);
  toast('已歸零');
  commit();
}
document.getElementById('lockBtn').addEventListener('click',()=>{
  state.locked=!locked;
  addLog(state.locked?'鎖定控制台':'解除鎖定',null);
  commit();
});

function fillNameInputs(onlyIfEmpty){
  const ev=document.getElementById('eventIn');
  if(!onlyIfEmpty || !ev.value) ev.value=(state&&state.event)||'';
  IDS.forEach(id=>{
    const inp=document.getElementById('nmIn'+id);
    if(!inp) return;
    if(onlyIfEmpty && document.activeElement===inp) return;   // 正在打字就不要蓋掉
    const team=state&&state.teams?state.teams.find(x=>x.id===id):null;
    if(team) inp.value=team.name;
  });
}

async function applyNames(){
  const tasks=[];
  IDS.forEach(id=>{
    const inp=document.getElementById('nmIn'+id);
    const team=state&&state.teams?state.teams.find(x=>x.id===id):null;
    const v=inp?inp.value.trim():'';
    if(v && team && v!==team.name) tasks.push({team:id,name:v});
  });
  const ev=document.getElementById('eventIn');
  if(!tasks.length && ev && ev.value.trim() && state && ev.value.trim()!==state.event){
    await sendEvent(ev.value.trim());
    return;
  }
  if(!tasks.length){ toast('沒有變更',true); return; }
  for(const task of tasks) await sendRename(task.team,task.name);
  if(ev && ev.value.trim() && state && ev.value.trim()!==state.event) await sendEvent(ev.value.trim());
}


function setConn(ok){
  document.getElementById('dot').classList.toggle('off',!ok);
  document.getElementById('st').textContent=ok?'已連線':'連線中斷，重試中…';
}

buildTeams();
render(state);        // 先畫出上次的分數（重開也不會掉）
connect();            // 連上後立刻廣播目前狀態給大螢幕
</script>
